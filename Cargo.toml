[package]
name = "sweep-rs"
version = "0.1.2"
edition = "2024"
description = "A fast, git-aware workspace cleanup tool written in Rust."
license = "MIT"
repository = "https://github.com/QuocAn108/sweep-rs"
homepage = "https://github.com/QuocAn108/sweep-rs"
readme = "README.md"
keywords = ["cli", "cleanup", "git", "workspace", "tui"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
authors = ["QuocAn108"]

[dependencies]
# CLI Parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Multi-threaded Traversal & Parallelism
jwalk = "0.8"
rayon = "1.10"

# Git Introspection
git2 = { version = "0.19", default-features = false, features = [] }

# Terminal UX & TUI
indicatif = { version = "0.17", features = ["rayon"] }
console = "0.15"
inquire = "0.7"
ratatui = "0.28"
crossterm = "0.28"

# Error Handling & Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scan_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
